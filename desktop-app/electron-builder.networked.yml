appId: cn.xiandingsi.temple-os
productName: TempleOS-联网版
directories:
  output: ../releases
files:
  - src/**/*
  - "!src/**/*.bak"
files:
  - "**/*"
  - "!node_modules"
  - "!nsis-cache/**"
extraResources:
  - from: ../frontend/.next/standalone
    to: frontend-standalone
    filter:
      - "**/*"
win:
  target: nsis
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  language: "2052"

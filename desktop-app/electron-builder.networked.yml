appId: cn.xiandingsi.temple-os
productName: TempleOS-联网版
directories:
  output: ../releases
files:
  - src/**/*
  - "!src/**/*.bak"
extraResources:
  - from: ../frontend/.next/standalone
    to: frontend-standalone
  - from: ../frontend/public
    to: frontend-public
  - from: ../frontend/.next/static
    to: frontend-static
win:
  target: zip
  signAndEditExecutable: false

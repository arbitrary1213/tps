appId: cn.xiandingsi.temple-os
productName: TempleOS-单机版
directories:
  output: ../releases
extraResources:
  - from: ../frontend/.next/standalone
    to: frontend-standalone
  - from: ../frontend/.next/standalone/standalone_deps
    to: standalone_deps
  - from: standalone.marker
    to: standalone.marker
win:
  target: nsis
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  language: "2052"
extraMetadata:
  env:
    TEMPLE_MODE: standalone
